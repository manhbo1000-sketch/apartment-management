{% extends "base.html" %}
{% block title %}Đổi mật khẩu · An Bình Residence{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">BẢO VỆ TÀI KHOẢN</p><h1>Đổi mật khẩu</h1><p class="muted">Tài khoản mới cần đổi mật khẩu khởi tạo trước khi sử dụng cổng cư dân.</p></div></section>
<section class="panel form-panel password-panel">
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Mật khẩu hiện tại<input name="current_password" type="password" required autocomplete="current-password"></label>
    <label>Mật khẩu mới<input name="new_password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><small>Tối thiểu 12 ký tự.</small></label>
    <label>Nhập lại mật khẩu mới<input name="confirmation" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
    <button class="button button-primary" type="submit">Lưu mật khẩu mới</button>
  </form>
</section>
{% endblock %}
