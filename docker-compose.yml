name: apartment-management

services:
  web:
    build:
      context: ./app
    environment:
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?Run scripts/new-secrets.ps1 or set APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: apartment
      DB_USER: apartment_app
      DB_PASSWORD: ${APARTMENT_DB_PASSWORD:?Set APARTMENT_DB_PASSWORD}
      LOG_FILE: /app/logs/app.json
    expose:
      - "8000"
    volumes:
      - app-logs:/app/logs
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: apartment
      POSTGRES_USER: apartment_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      APARTMENT_DB_PASSWORD: ${APARTMENT_DB_PASSWORD:?Set APARTMENT_DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartment_admin -d apartment"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: "80"
      PGADMIN_CONFIG_SCRIPT_NAME: "'/pgadmin'"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    expose:
      - "80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - nginx-logs:/var/log/nginx
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
      pgadmin:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  edge:
    name: apartment-edge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  data:
    name: apartment-data
    internal: true

volumes:
  postgres-data:
  pgadmin-data:
  app-logs:
  nginx-logs:
