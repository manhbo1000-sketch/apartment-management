name: apartment-management

services:
  web:
    build:
      context: ./app
    environment:
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?Run scripts/new-secrets.ps1 or set APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: apartment
      DB_USER: apartment_app
      DB_PASSWORD: ${APARTMENT_DB_PASSWORD:?Set APARTMENT_DB_PASSWORD}
      LOG_FILE: /app/logs/app.json
      FLASK_ENV: production
    expose:
      - "8000"
    volumes:
      - app-logs:/app/logs
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: apartment
      POSTGRES_USER: apartment_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      APARTMENT_DB_PASSWORD: ${APARTMENT_DB_PASSWORD:?Set APARTMENT_DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=3775
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartment_admin -d apartment"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: "80"
      PGADMIN_CONFIG_SCRIPT_NAME: "'/pgadmin'"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    expose:
      - "80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    build:
      context: ./nginx
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - nginx-logs:/var/log/nginx
    networks:
      - edge
      - ingress
    depends_on:
      web:
        condition: service_healthy
      pgadmin:
        condition: service_healthy
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.external-url=http://localhost:${HTTP_PORT:-8080}/prometheus/
      - --web.route-prefix=/prometheus/
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - edge
      - data
      - observability
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${APP_ADMIN_USERNAME:?Set APP_ADMIN_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:${HTTP_PORT:-8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - edge
      - observability
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:3.6.11
    command: ["-config.file=/etc/loki/config.yml"]
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - observability
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  promtail:
    image: grafana/promtail:3.6.11
    command: ["-config.file=/etc/promtail/config.yml"]
    user: "101:2000"
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - app-logs:/var/log/apartment:ro
      - nginx-logs:/var/log/nginx:ro
    networks:
      - observability
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/apartment?sslmode=disable
      DATA_SOURCE_USER: apartment_app
      DATA_SOURCE_PASS: ${APARTMENT_DB_PASSWORD:?Set APARTMENT_DB_PASSWORD}
    expose:
      - "9187"
    networks:
      - data
      - observability
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    command:
      - --nginx.scrape-uri=http://nginx:8080/nginx_status
    expose:
      - "9113"
    networks:
      - edge
      - observability
    depends_on:
      nginx:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --allow_dynamic_housekeeping=false
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - observability
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  ingress:
    name: apartment-ingress
  edge:
    name: apartment-edge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  data:
    name: apartment-data
    internal: true
  observability:
    name: apartment-observability
    internal: true

volumes:
  postgres-data:
  pgadmin-data:
  app-logs:
  nginx-logs:
  prometheus-data:
  grafana-data:
  loki-data:
