groups:
  - name: apartment-availability
    rules:
      - alert: ApartmentWebUnavailable
        expr: up{job="apartment-web"} == 0
        for: 1m
        labels:
          severity: critical
          service: apartment-web
        annotations:
          summary: "Website quản lý chung cư không phản hồi"
          description: "Prometheus không scrape được {{ $labels.instance }} trong ít nhất 1 phút. Kiểm tra container web và log ứng dụng."

      - alert: PrometheusScrapeTargetUnavailable
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Một target Prometheus đang DOWN"
          description: "Target {{ $labels.job }} tại {{ $labels.instance }} không scrape được trong ít nhất 1 phút."
