global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: apartment-management

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: apartment-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
