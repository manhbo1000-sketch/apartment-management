server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: apartment-web
    static_configs:
      - targets: [localhost]
        labels:
          job: apartment-web
          service: apartment-web
          __path__: /var/log/apartment/app.json
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
      - labels:
          level:
          event:

  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx
          __path__: /var/log/nginx/access.json
    pipeline_stages:
      - json:
          expressions:
            level: level
            status: status
            method: method
      - labels:
          level:
          status:
          method:
